<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Logwise — Log · Reflect · Improve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Optional: only used when FIREBASE_CONFIG (in the script below) is filled in, for cross-device login + sync -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root[data-theme="dark"]{
    --bg:#0A0E17; --surface:#111827; --surface-2:#1A2233; --surface-3:#232C40;
    --border:#2A3349; --border-soft:#1F2839;
    --text:#E8ECF6; --text-dim:#8B93A8; --text-faint:#5C6478;
    --blue:#3B7CF6; --blue-2:#6EA6FF; --blue-dim:rgba(59,124,246,0.14);
    --green:#2ECC71; --green-dim:rgba(46,204,113,0.12);
    --red:#F0554D; --red-dim:rgba(240,85,77,0.12);
    --shadow:0 12px 32px rgba(0,0,0,0.4);
  }
  :root[data-theme="light"]{
    --bg:#F1F4FA; --surface:#FFFFFF; --surface-2:#F6F8FC; --surface-3:#EBEFF7;
    --border:#DFE4EF; --border-soft:#E9ECF4;
    --text:#131826; --text-dim:#5B6478; --text-faint:#98A1B5;
    --blue:#2F5FD8; --blue-2:#3B7CF6; --blue-dim:rgba(47,95,216,0.08);
    --green:#1FA463; --green-dim:rgba(31,164,99,0.09);
    --red:#D63C34; --red-dim:rgba(214,60,52,0.09);
    --shadow:0 12px 28px rgba(20,24,36,0.10);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
    transition:background .2s ease,color .2s ease;
  }
  ::selection{background:var(--blue-dim);}
  .mono{font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums;}
  .display{font-family:'Space Grotesk',sans-serif;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; color:var(--text); background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:9px 11px; font-size:13.5px; outline:none; transition:border-color .15s;}
  input:focus,select:focus,textarea:focus{border-color:var(--blue);}
  input::placeholder,textarea::placeholder{color:var(--text-faint);}
  .app-shell{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:236px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:20px 14px; position:sticky; top:0;
    height:100vh; height:100dvh; /* dvh accounts for mobile browser chrome (address bar) so content never hides below the fold */
    overflow-y:auto; /* fallback: if content is still taller than the viewport, it scrolls instead of disappearing */
  }
  .brand{display:flex; align-items:center; gap:9px; padding:4px 6px 18px 6px; border-bottom:1px solid var(--border-soft); margin-bottom:14px;}
  .brand svg{flex-shrink:0;}
  .brand-text{display:flex; flex-direction:column; gap:3px;}
  .brand-word{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px; letter-spacing:-0.02em; line-height:1;}
  .brand-word span{color:var(--blue);}
  .brand-tagline{font-size:8px; letter-spacing:.16em; color:var(--text-faint); text-transform:uppercase; font-weight:600;}
  .header-slogan{font-size:10.5px; letter-spacing:.14em; color:var(--text-faint); text-transform:uppercase; font-weight:600; margin-top:4px;}
  .nav-group-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--text-faint); padding:14px 10px 6px;}
  .nav-btn{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:9px 10px;
    border-radius:9px; border:none; background:transparent; color:var(--text-dim); font-size:13.5px; font-weight:500;
    margin-bottom:2px; transition:background .12s, color .12s;
  }
  .nav-btn svg{flex-shrink:0; opacity:.85;}
  .nav-btn:hover{background:var(--surface-2); color:var(--text);}
  .nav-btn.active{background:var(--blue-dim); color:var(--blue-2); font-weight:600;}
  .nav-btn.active svg{opacity:1;}
  .market-toggle{display:flex; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:3px; margin-bottom:8px;}
  .market-toggle button{flex:1; padding:7px 0; border:none; background:transparent; border-radius:7px; font-size:12.5px; font-weight:600; color:var(--text-dim);}
  .market-toggle button.active{background:var(--blue); color:#fff;}
  .sidebar-spacer{flex:1;}
  .theme-toggle{display:flex; align-items:center; justify-content:space-between; padding:10px 10px; border-radius:9px; background:var(--surface-2); border:1px solid var(--border);}
  .theme-toggle-btn{display:flex; align-items:center; gap:6px; border:none; background:none; color:var(--text-dim); font-size:12px; font-weight:600; padding:5px 8px; border-radius:6px;}
  .theme-toggle-btn.active{background:var(--surface-3); color:var(--text);}

  /* ---------- Main ---------- */
  .main{flex:1; padding:26px 34px 60px; max-width:1180px;}
  .page-header{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px;}
  .page-title{font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; letter-spacing:-0.01em;}
  .page-sub{color:var(--text-dim); font-size:13px; margin-top:3px;}
  .pill{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:3px 9px; border-radius:99px; text-transform:uppercase; letter-spacing:.04em;}
  .pill-crypto{background:var(--blue-dim); color:var(--blue-2);}
  .pill-fx{background:var(--green-dim); color:var(--green);}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px; box-shadow:var(--shadow);}
  .card + .card{margin-top:18px;}

  /* Dropzone */
  .dropzone{
    border:1.5px dashed var(--border); border-radius:14px; background:var(--surface-2);
    padding:30px 20px; text-align:center; transition:border-color .15s, background .15s; cursor:pointer;
  }
  .dropzone.dragover{border-color:var(--blue); background:var(--blue-dim);}
  .dropzone svg{margin-bottom:8px; opacity:.7;}
  .dropzone-title{font-weight:600; font-size:14px;}
  .dropzone-sub{color:var(--text-dim); font-size:12.5px; margin-top:4px;}
  .dz-status{margin-top:12px; font-size:12.5px; color:var(--blue-2); display:none;}
  .dz-status.show{display:block;}
  .dz-status.error{color:var(--red);}

  /* Trade list — card layout so every field is visible without clicking in */
  .trade-row{
    border-radius:10px; border:1px solid transparent; cursor:pointer;
    padding:12px 14px; transition:background .12s,border-color .12s; margin-bottom:6px;
  }
  .trade-row:hover{background:var(--surface-2); border-color:var(--border);}
  .tc-top{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;}
  .tc-left{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .tc-symbol{font-weight:700; font-size:14px;}
  .tc-date{color:var(--text-faint); font-size:11px; font-family:'JetBrains Mono',monospace;}
  .tc-right{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .tc-meta{display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:9px;}
  .tc-meta-item{font-size:12px; color:var(--text-dim); white-space:nowrap;}
  .tc-meta-item .k{color:var(--text-faint); margin-right:4px;}
  .tc-meta-item .v{font-family:'JetBrains Mono',monospace; color:var(--text); font-weight:500;}
  .tc-pnl-row{margin-top:9px; display:flex; align-items:center; gap:7px;}
  .tc-pnl-label{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); font-weight:700;}
  .tc-pnl-val{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px;}
  .del-btn{background:none; border:none; color:var(--text-faint); width:26px; height:26px; display:flex; align-items:center; justify-content:center; border-radius:7px; flex-shrink:0;}
  .del-btn:hover{background:var(--red-dim); color:var(--red);}
  .side-tag{font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px; width:fit-content;}
  .side-long{background:var(--green-dim); color:var(--green);}
  .side-short{background:var(--red-dim); color:var(--red);}
  .pnl-pos{color:var(--green);}
  .pnl-neg{color:var(--red);}
  .review-badge{font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:99px; white-space:nowrap;}
  .review-done{background:var(--green-dim); color:var(--green);}
  .review-pending{background:var(--surface-3); color:var(--text-faint);}
  .empty-state{text-align:center; padding:36px 10px; color:var(--text-dim);}
  .empty-state svg{opacity:.4; margin-bottom:10px;}

  /* Form grid */
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px 16px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:12px; font-weight:600; color:var(--text-dim);}
  .field-full{grid-column:1 / -1;}
  .section-label{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); font-weight:700; margin:20px 0 10px; padding-top:14px; border-top:1px solid var(--border-soft);}
  .section-label:first-child{margin-top:0; padding-top:0; border-top:none;}

  .btn{border:none; border-radius:9px; padding:10px 18px; font-size:13.5px; font-weight:600; transition:opacity .15s, transform .1s;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--blue); color:#fff;}
  .btn-primary:disabled{opacity:.35; cursor:not-allowed;}
  .btn-ghost{background:var(--surface-2); color:var(--text-dim); border:1px solid var(--border);}
  .btn-danger{background:var(--red-dim); color:var(--red); border:1px solid transparent;}

  /* Checkbox pair */
  .check-row{display:flex; align-items:center; gap:8px; font-size:13.5px; padding:9px 4px; cursor:pointer; user-select:none;}
  .check-box{width:17px; height:17px; border-radius:5px; border:1.5px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--surface-2);}
  .check-box.checked{background:var(--blue); border-color:var(--blue);}
  .check-box.checked::after{content:''; width:7px; height:4px; border-left:2px solid #fff; border-bottom:2px solid #fff; transform:rotate(-45deg) translate(1px,-1px);}

  /* Calendar */
  .cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .cal-nav-btns{display:flex; gap:4px;}
  .icon-btn{background:var(--surface-2); border:1px solid var(--border); border-radius:8px; width:30px; height:30px; display:flex; align-items:center; justify-content:center; color:var(--text-dim); flex-shrink:0;}
  .icon-btn:hover{color:var(--text); border-color:var(--blue);}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-dow{text-align:center; font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; padding-bottom:4px;}
  .cal-cell{aspect-ratio:1/0.82; border-radius:10px; border:1px solid var(--border-soft); background:var(--surface-2); padding:7px 8px; font-size:11px; cursor:default; display:flex; flex-direction:column; justify-content:space-between; transition:transform .1s, border-color .1s;}
  .cal-cell.has-trades{cursor:pointer;}
  .cal-cell.has-trades:hover{transform:translateY(-2px); border-color:var(--blue);}
  .cal-cell.empty{background:transparent; border-color:transparent;}
  .cal-cell.win{background:var(--green-dim); border-color:transparent;}
  .cal-cell.loss{background:var(--red-dim); border-color:transparent;}
  .cal-daynum{color:var(--text-dim); font-weight:600;}
  .cal-cell.win .cal-daynum{color:var(--green);}
  .cal-cell.loss .cal-daynum{color:var(--red);}
  .cal-pnl{font-family:'JetBrains Mono',monospace; font-weight:600; font-size:12px;}
  .cal-count{color:var(--text-faint); font-size:10px;}

  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:14px;}
  .stat-box{background:var(--surface-2); border:1px solid var(--border-soft); border-radius:10px; padding:12px 14px;}
  .stat-label{font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; margin-bottom:5px;}
  .stat-value{font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:600;}

  .bars{display:flex; align-items:flex-end; gap:8px; height:110px; margin-top:16px;}
  .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end;}
  .bar{width:100%; border-radius:5px 5px 2px 2px; background:var(--blue); min-height:3px; transition:height .3s;}
  .bar.neg{background:var(--red);}
  .bar-label{font-size:10px; color:var(--text-faint);}

  .week-row{display:flex; justify-content:space-between; align-items:center; padding:11px 4px; border-bottom:1px solid var(--border-soft);}
  .week-row:last-child{border-bottom:none;}
  .week-name{font-size:13px; font-weight:600; color:var(--text-dim);}
  .week-trades{font-size:11.5px; color:var(--text-faint); margin-top:2px;}

  /* Modal */
  .modal-backdrop{position:fixed; inset:0; background:rgba(4,7,14,0.55); backdrop-filter:blur(2px); display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto; z-index:50;}
  .modal{background:var(--surface); border:1px solid var(--border); border-radius:16px; width:100%; max-width:640px; padding:24px; box-shadow:var(--shadow); animation:pop .15s ease; box-sizing:border-box;}
  @keyframes pop{from{transform:translateY(6px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; gap:10px;}
  .modal-close{background:none; border:none; color:var(--text-dim); font-size:20px; line-height:1; flex-shrink:0;}
  .trade-summary-strip{display:flex; gap:14px 18px; flex-wrap:wrap; background:var(--surface-2); border:1px solid var(--border-soft); border-radius:10px; padding:12px 14px; margin-bottom:18px; font-size:12.5px;}
  .trade-summary-strip div span{display:block; color:var(--text-faint); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:2px;}

  select.dropbox{width:100%;}

  .toast{position:fixed; bottom:24px; right:24px; background:var(--surface-3); border:1px solid var(--border); color:var(--text); padding:12px 16px; border-radius:10px; font-size:13px; box-shadow:var(--shadow); z-index:80; animation:pop .15s ease; max-width:calc(100vw - 48px);}

  /* Multi-select chips — chips live inside the same box as the text input, custom dropdown below (not the native browser popup) */
  .multiselect{display:flex; flex-direction:column; position:relative;}
  .ms-box{
    display:flex; flex-wrap:wrap; align-items:center; gap:6px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
    padding:6px 8px; cursor:text; transition:border-color .15s;
  }
  .ms-box:focus-within{border-color:var(--blue);}
  .ms-box > .chips-slot{display:contents;}
  .chip{display:inline-flex; align-items:center; gap:6px; background:var(--blue-dim); color:var(--blue-2); font-size:12px; font-weight:600; padding:4px 6px 4px 10px; border-radius:99px; max-width:100%; flex-shrink:0;}
  .chip-x{background:none; border:none; color:inherit; font-size:14px; line-height:1; padding:0 2px; opacity:.75; flex-shrink:0;}
  .chip-x:hover{opacity:1;}
  .ms-inline-input{
    flex:1 1 90px; min-width:90px; border:none !important; background:transparent !important;
    padding:4px 2px !important; font-size:13.5px; outline:none;
  }
  .ms-caret{
    background:none; border:none; color:var(--text-faint); flex-shrink:0; display:flex; align-items:center;
    justify-content:center; width:22px; height:22px; border-radius:6px; transition:transform .15s, color .15s;
  }
  .ms-caret:hover{color:var(--text);}
  .ms-caret.open{transform:rotate(180deg); color:var(--blue-2);}
  .opt-tag{color:var(--text-faint); font-weight:500; text-transform:none; letter-spacing:0;}
  .ms-panel{
    display:none; position:absolute; left:0; right:0; top:calc(100% + 6px);
    background:var(--surface-3); border:1px solid var(--border); border-radius:10px;
    box-shadow:var(--shadow); max-height:220px; overflow-y:auto; z-index:20; padding:6px;
  }
  .ms-panel.open{display:block;}
  .ms-opt{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:none; border:none;
    padding:9px 10px; border-radius:7px; font-size:13px; color:var(--text); white-space:normal;
  }
  .ms-opt:hover{background:var(--surface-2);}
  .ms-opt.sel{color:var(--blue-2); font-weight:600;}
  .ms-opt-check{width:16px; height:16px; border-radius:5px; border:1.5px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px;}
  .ms-opt.sel .ms-opt-check{background:var(--blue); border-color:var(--blue); color:#fff;}
  .ms-opt-custom{color:var(--blue-2); font-weight:600;}
  .ms-empty{padding:10px; font-size:12.5px; color:var(--text-faint);}

  /* Custom confirm dialog (used instead of window.confirm, which some embedded views block) */
  .confirm-box{max-width:360px; text-align:center;}
  .confirm-box .btn{min-width:100px;}

  @media (max-width:880px){
    .sidebar{position:fixed; z-index:45; transform:translateX(-100%); transition:transform .2s;}
    .sidebar.open{transform:translateX(0);}
    .main{padding:70px 14px 40px;}
    .form-grid{grid-template-columns:1fr;}
    .stat-grid{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:560px){
    .main{padding:64px 10px 40px;}
    .card{padding:14px;}
    .page-title{font-size:19px;}
    .modal-backdrop{padding:0;}
    .modal{border-radius:0; max-width:100%; min-height:100vh; padding:18px 14px 40px;}
    .trade-summary-strip{gap:10px 14px; font-size:12px;}
    input,select,textarea{font-size:16px;} /* prevents iOS auto-zoom on focus */
    .stat-grid{grid-template-columns:repeat(2,1fr); gap:8px;}
  }
  .mobile-bar{display:none; position:fixed; top:0; left:0; right:0; height:52px; background:var(--surface); border-bottom:1px solid var(--border); align-items:center; padding:0 12px; z-index:41; gap:9px;}
  .mobile-bar .icon-btn{flex-shrink:0;}
  .mobile-logo{flex-shrink:0; width:24px; height:24px; display:flex; align-items:center; justify-content:center;}
  .mobile-logo svg{width:24px; height:24px; display:block;}
  .mobile-brand-text{display:flex; flex-direction:column; min-width:0; overflow:hidden;}
  .mobile-brand-text .brand-word{font-size:16px; white-space:nowrap;}
  .mobile-brand-text .brand-tagline{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  @media (max-width:880px){.mobile-bar{display:flex;}}
  .mobile-bar.dimmed{visibility:hidden;}
  .sidebar-overlay{display:none; position:fixed; inset:0; background:rgba(4,7,14,0.5); z-index:44;}
  .sidebar-overlay.open{display:block;}
  .sidebar-close-btn{display:none;}
  @media (max-width:880px){
    .sidebar-close-btn{display:flex; align-items:center; justify-content:center; margin-left:auto; background:none; border:none; color:var(--text-dim); font-size:20px; line-height:1; padding:4px 6px; flex-shrink:0;}
  }
  @media (max-width:340px){.mobile-brand-text .brand-tagline{display:none;}}

  /* ---------------- Auth screen ---------------- */
  .auth-screen{position:fixed; inset:0; background:var(--bg); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px;}
  .auth-card{width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px 26px; box-shadow:var(--shadow);}
  .auth-brand{display:flex; align-items:center; gap:10px; margin-bottom:22px;}
  .auth-title{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; margin-bottom:4px;}
  .auth-sub{color:var(--text-dim); font-size:12.5px; margin-bottom:20px; line-height:1.5;}
  .auth-field{margin-bottom:12px;}
  .auth-field input{width:100%;}
  .auth-error{color:var(--red); font-size:12.5px; margin-bottom:10px; display:none;}
  .auth-error.show{display:block;}
  .auth-btn-row{display:flex; flex-direction:column; gap:8px; margin-top:6px;}
  .auth-switch{text-align:center; margin-top:16px; font-size:12.5px; color:var(--text-dim);}
  .auth-switch a{color:var(--blue-2); cursor:pointer; text-decoration:none;}
</style>
<!-- Firebase (only used if FIREBASE_CONFIG below is filled in — see README) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
</head>
<body>

/* ---------------- storage ----------------
   Uses the Claude artifact storage API when available (window.storage).
   Falls back to the browser's own localStorage when this file is opened

   daily rather than draining a one-time credit). Your key stays private on

async function firestoreLoad(uid){
  try{
    const doc = await fbDb.collection('logwise_users').doc(uid).get();
    return doc.exists ? doc.data() : null;
  }catch(e){ console.error(e); return null; }
}
async function firestoreSave(uid, data){
  try{
    await fbDb.collection('logwise_users').doc(uid).set(
      { ...data, updatedAt: firebase.firestore.FieldValue.serverTimestamp() },
      { merge: true }
    );
    return true;
  }catch(e){ console.error(e); return false; }
}

/* Fires whenever Firebase's sign-in state resolves or changes (including
   automatically on page load if this browser was already signed in). */
async function handleAuthStateChange(user){
  currentUser = user;
  if(user){
    const cloudData = await firestoreLoad(user.uid);
    if(cloudData){
      // An account already has data in the cloud — that becomes the source
      // of truth on this device from now on.
      if(cloudData.trades){ try{ state.trades = JSON.parse(cloudData.trades); }catch(e){} }
      if(cloudData.theme){ state.theme = cloudData.theme; document.documentElement.setAttribute('data-theme', state.theme); }
    } else {
      // First time this account has ever signed in — seed the cloud with
      // whatever was already journaled locally on this device, so nothing
      // gets lost by logging in.
      await firestoreSave(user.uid, { trades: JSON.stringify(state.trades), theme: state.theme });
    }
  }
  render();
}
if(hasFirebase){
  fbAuth.onAuthStateChanged(handleAuthStateChange);
}

async function storageGet(key){
  if(hasArtifactStorage){
    try{ return await window.storage.get(key, false); }catch(e){ return null; }
  }
  try{
    const v = localStorage.getItem('logwise:'+key);
    return v!==null ? { key, value: v } : null;
  }catch(e){ return null; }
}
async function storageSet(key, value){
  if(hasArtifactStorage){
    try{ return await window.storage.set(key, value, false); }catch(e){ return null; }
  }
  try{
    localStorage.setItem('logwise:'+key, value);
    return { key, value };
  }catch(e){ return null; }
}

async function loadState(){
  try{
    const t = await storageGet('logwise-trades');
    if(t && t.value) state.trades = JSON.parse(t.value);
  }catch(e){ /* no saved trades yet */ }
  try{
    const th = await storageGet('logwise-theme');
    if(th && th.value) state.theme = th.value;
  }catch(e){ /* default theme */ }
  document.documentElement.setAttribute('data-theme', state.theme);
}
async function persistTrades(){
  if(hasFirebase && currentUser){

    if(!ok) showToast('Could not sync — check your connection and try again.');
    return;
  }
  const res = await storageSet('logwise-trades', JSON.stringify(state.trades));
  if(!res) showToast('Could not save — data kept in this session only.');
}

    backdrop.innerHTML = `

    document.body.appendChild(backdrop);

    document.getElementById('cc_cancel').onclick = ()=> finish(false);
    document.getElementById('cc_ok').onclick = ()=> finish(true);
    backdrop.onclick = (e)=>{ if(e.target===backdrop) finish(false); };
  });
}

async function deleteTrade(id){
  const ok = await customConfirm('It will be removed from the Trade Terminal and from all Performance stats.');
  if(!ok) return;
  const list = state.trades[state.market];
  const idx = list.findIndex(t=>t.id===id);
  if(idx===-1) return;
  list.splice(idx,1);
  await persistTrades();
  if(state.reviewingId===id) state.reviewingId=null;
  showToast('Trade deleted.');
  render();
}
async function persistTheme(){
  if(hasFirebase && currentUser){
    await firestoreSave(currentUser.uid, { theme: state.theme });
    return;
  }
  await storageSet('logwise-theme', state.theme);
}

/* ---------------- helpers ---------------- */
function uid(){ return 'tr_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function fmtMoney(n, withSign){
  if(n===null||n===undefined||n==='') return '—';
  const num = Number(n);
  if(isNaN(num)) return '—';
  const sign = withSign && num>0 ? '+' : (num<0 ? '-' : '');
  const s = Math.abs(num).toFixed(2);
  return sign + '$' + s;
}
function pnlClass(n){ const num=Number(n); if(isNaN(num)) return ''; return num>0?'pnl-pos':(num<0?'pnl-neg':''); }
function hasVal(v){ return Array.isArray(v) ? v.length>0 : !!(v && String(v).trim()); }
function reviewComplete(r){
  if(!r) return false;
  // "mistake" is optional — every other field is required
  return !!(r.followed!==null && r.followed!==undefined && hasVal(r.whichPlan) && hasVal(r.confluence) && hasVal(r.tradeManagement) && hasVal(r.entryEmotion) && hasVal(r.exitEmotion) && hasVal(r.note));
}
function currentTrades(){ return state.trades[state.market]; }
function showToast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function setDzStatus(msg, isError){
  const el = document.getElementById('dzStatus');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  el.classList.toggle('error', !!isError);
}

async function handleScreenshot(file){
  if(!file.type.startsWith('image/')){ setDzStatus('Please drop an image file.', true); return; }
  if(needsOwnKey){
    const key = await getApiKey();
    if(!key){ setDzStatus('Add your Gemini API key in Settings to enable screenshot reading.', true); openSettings(); return; }
  }
  setDzStatus('Reading screenshot…');
  try{
    const {base64, mediaType} = await fileToBase64(file);
    setDzStatus('Extracting trade details…');
    const parsed = await analyzeScreenshot(base64, mediaType);
    const trade = normalizeParsedTrade(parsed);
    currentTrades().push(trade);
    await persistTrades();
    setDzStatus('Trade journaled ✓');
    render();
    setTimeout(()=>{ const s=document.getElementById('dzStatus'); if(s) s.classList.remove('show'); }, 2500);
  }catch(err){
    console.error(err);
    const msg = String((err && err.message) || '');
    if(msg.includes('missing-api-key')){
      setDzStatus('Add your Gemini API key in Settings to enable screenshot reading.', true);
      openSettings();
    } else {
      // Surface the real error text (e.g. from Gemini or the proxy) instead
      // of hiding it — makes diagnosing a bad key/model/proxy config possible
      // without needing to dig through server-side logs.
      setDzStatus('Could not read that screenshot' + (msg ? ': ' + msg : '') + ' — try again or add it manually.', true);
    }
  }
}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve({ base64: r.result.split(',')[1], mediaType: file.type });
    r.onerror = ()=> reject(new Error('read failed'));
    r.readAsDataURL(file);
  });
}

const EXTRACT_PROMPT = `You are reading a screenshot of a single trade or trade history entry (often two linked entries — an open/close pair for the same position) from a crypto or FX trading exchange app (the exchange could be any platform — Binance, Bybit, OKX, MT4/MT5, a broker app, etc). Extract the trade details and respond with ONLY a raw JSON object, no markdown fences, no commentary. Use this exact schema, using null for anything not visible:
{
 "symbol": string|null,
 "side": string|null,          // "long" or "short" (map buy/long-open to "long", sell/short-open to "short")
 "orderType": string|null,     // e.g. "Limit", "Stop Loss", "Market"
 "orderAmount": number|null,   // the order amount / size of the position
 "filledAmount": number|null,
 "avgEntryPrice": number|null, // average entry price
 "avgExitPrice": number|null,  // average exit price
 "feeOpen": number|null,       // fee charged when the position was opened, if shown separately
 "feeClose": number|null,      // fee charged when the position was closed, if shown separately
 "leverage": string|null,      // crypto leverage, e.g. "5x" — only for crypto/futures positions
 "lotSize": number|null,       // FX lot size (position size in lots, e.g. 0.10) — only for FX positions
 "marginMode": string|null,    // "cross" or "isolated" — only for crypto/futures positions
 "pips": number|null,          // FX pips gained/lost on the trade, if shown — only for FX positions
 "swap": number|null,          // FX swap/rollover or commission charge, if shown — only for FX positions
 "realizedPnL": number|null,
 "entryTime": string|null,     // full date+time the position was opened, e.g. "2026-08-26 22:25:18"
 "exitTime": string|null,      // full date+time the position was closed
 "date": string|null,          // YYYY-MM-DD, the most relevant/most recent date shown
 "positionId": string|null,
 "market": string|null         // "crypto" or "fx", your best guess from the symbol/app
}
If the screenshot shows separate opening and closing fee amounts for the same position, put each one in feeOpen/feeClose respectively — do not sum them yourself, that is done afterward. Respond with the JSON object only.`;

/* Free-tier Gemini model used for self-hosted screenshot reading.
   If this ever needs updating, check https://ai.google.dev/gemini-api/docs/models
   for the current free-tier Flash-Lite model name/alias. */
const GEMINI_MODEL = 'gemini-flash-lite-latest';

async function analyzeScreenshot(base64, mediaType){
  if(hasArtifactStorage){
    // Running inside Claude — use Claude's vision API directly; auth is
    // handled transparently by the platform, no key needed here.
    return analyzeScreenshotClaude(base64, mediaType);
  }
  // Running self-hosted — use Google Gemini's vision API. Gemini has an
  // ongoing free tier (not just a one-time trial credit), so this is the
  // path that can stay genuinely free indefinitely.
  return analyzeScreenshotGemini(base64, mediaType);
}

async function analyzeScreenshotClaude(base64, mediaType){
  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
          { type: "text", text: EXTRACT_PROMPT }
        ]
      }]
    })
  });
  const data = await resp.json();
  if(data && data.error) throw new Error(data.error.message || 'api-error');
  const textBlock = (data.content||[]).map(b=>b.text||'').join('');
  const clean = textBlock.replace(/```json|```/g,'').trim();
  return JSON.parse(clean);
}

async function analyzeScreenshotGemini(base64, mediaType){
  const headers = { "Content-Type": "application/json" };
  let endpoint;

  if(PROXY_URL){
    // Shared proxy configured — it holds the Gemini key server-side, so no
    // key is needed from this browser at all.
    endpoint = PROXY_URL;
  } else {
    // No proxy — fall back to a personal Gemini key, entered once in
    // Settings and kept only in this browser's localStorage.
    const key = await getApiKey();
    if(!key) throw new Error('missing-api-key');
    headers["x-goog-api-key"] = key;
    endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;
  }

  const resp = await fetch(endpoint, {
    method: "POST",
    headers,
    body: JSON.stringify({
      contents: [{
        parts: [
          { inline_data: { mime_type: mediaType, data: base64 } },
          { text: EXTRACT_PROMPT }
        ]
      }],
      generationConfig: { responseMimeType: "application/json" }
    })
  });
  const raw = await resp.text();
  let data;
  try{ data = JSON.parse(raw); }
  catch(e){ throw new Error(`Unexpected response (HTTP ${resp.status}): ${raw.slice(0,180)}`); }

  if(data && data.error) throw new Error(`Gemini error (HTTP ${resp.status}): ${data.error.message || 'unknown'}`);
  if(!resp.ok) throw new Error(`Request failed (HTTP ${resp.status})`);

  const blockReason = data.promptFeedback && data.promptFeedback.blockReason;
  if(blockReason) throw new Error(`Gemini blocked the response (${blockReason})`);

  const parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
  const textBlock = parts.map(p=>p.text||'').join('');
  const clean = textBlock.replace(/```json|```/g,'').trim();
  if(!clean) throw new Error('Gemini returned an empty response');
  try{ return JSON.parse(clean); }
  catch(e){ throw new Error('Could not parse the extracted trade data'); }
}

function computeDuration(entryTime, exitTime){
  if(!entryTime || !exitTime) return '';
  const a = new Date(String(entryTime).replace(' ','T'));
  const b = new Date(String(exitTime).replace(' ','T'));
  if(isNaN(a) || isNaN(b)) return '';
  let diff = Math.abs(b-a)/1000;
  const h = Math.floor(diff/3600); diff -= h*3600;
  const mnt = Math.floor(diff/60);
  if(!h && !mnt) return '<1m';
  return (h?h+'h ':'') + mnt + 'm';
}

function normalizeParsedTrade(p){
  const today = new Date().toISOString().slice(0,10);
  const feeOpen = (p.feeOpen!==undefined && p.feeOpen!==null && p.feeOpen!=='') ? Number(p.feeOpen) : null;
  const feeClose = (p.feeClose!==undefined && p.feeClose!==null && p.feeClose!=='') ? Number(p.feeClose) : null;
  let fee = '';
  if(feeOpen!==null || feeClose!==null) fee = +(((feeOpen||0) + (feeClose||0)).toFixed(8));
  else if(p.fee!==undefined && p.fee!==null && p.fee!=='') fee = p.fee;

  return {
    id: uid(),
    market: state.market,
    source: 'screenshot',
    symbol: p.symbol || 'Unknown',
    side: (p.side||'').toLowerCase().includes('short') ? 'short' : ((p.side||'').toLowerCase().includes('long')?'long':(p.side||'—')),
    orderType: p.orderType || '',
    orderAmount: p.orderAmount ?? '',
    filledAmount: p.filledAmount ?? '',
    entryPrice: p.avgEntryPrice ?? '',
    exitPrice: p.avgExitPrice ?? '',
    fee: fee,
    realizedPnL: p.realizedPnL ?? '',
    leverage: p.leverage || '',
    lotSize: p.lotSize ?? '',
    marginMode: p.marginMode || '',
    entryTime: p.entryTime || '',
    exitTime: p.exitTime || '',
    duration: computeDuration(p.entryTime, p.exitTime),
    date: (p.date && /^\d{4}-\d{2}-\d{2}/.test(p.date)) ? p.date.slice(0,10) : today,
    time: p.exitTime || '',
    positionId: p.positionId || '',
    stopLoss:'', takeProfit:'', cost:'', swap: p.swap ?? '', pips: p.pips ?? '', riskReward:'', rewardPct:'',
    review: { followed:null, whichPlan:[], confluence:[], mistake:[], tradeManagement:'', riskReward:'', entryEmotion:[], exitEmotion:[], note:'' }
  };
}

function ffield(id, label, opts){
  opts = opts || {};
  const req = opts.required ? ' *' : '';
  const type = opts.type || 'text';
  if(opts.select){
    return `<div class="field"><label>${esc(label)}${req}</label>
      <select id="${id}">
        <option value="">Select…</option>
        ${opts.select.map(o=>`<option value="${o.value}">${esc(o.label)}</option>`).join('')}
      </select>
    </div>`;
  }
  const step = type==='number' ? ' step="any"' : '';
  const readonly = opts.readonly ? ' readonly' : '';
  const ph = opts.placeholder ? ` placeholder="${esc(opts.placeholder)}"` : '';
  return `<div class="field"><label>${esc(label)}${req}</label><input id="${id}" type="${type}"${step}${ph}${readonly}></div>`;
}

function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function firstWeekdayMon(y,m){ const d = new Date(y,m,1).getDay(); return (d+6)%7; } // 0=Mon

function tradesForDate(dateStr){ return currentTrades().filter(t=>t.date===dateStr); }

function renderPerformance(){
  const y = state.calYear, m = state.calMonth;
  const trades = currentTrades();

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">Performance <span class="pill ${state.market==='crypto'?'pill-crypto':'pill-fx'}">${state.market}</span></div>
        <div class="page-sub">Click a day to see the trades you took.</div>
      </div>
    </div>

    <div class="card">
      <div class="cal-nav">
        <div style="font-weight:700; font-family:'Space Grotesk',sans-serif; font-size:15px;">${MONTHS[m]} ${y}</div>
        <div class="cal-nav-btns">
          <button class="icon-btn" id="calPrev">${ICONS.chevL}</button>
          <button class="icon-btn" id="calNext">${ICONS.chevR}</button>
        </div>
      </div>
      <div class="cal-grid">
        ${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${calendarCells(y,m,trades)}
      </div>
    </div>

    <div class="card">
      <div style="font-weight:700; font-family:'Space Grotesk',sans-serif; font-size:15px; margin-bottom:4px;">Monthly Summary</div>
      ${monthlySummaryHtml(y,m,trades)}
    </div>

    <div class="card">
      <div style="font-weight:700; font-family:'Space Grotesk',sans-serif; font-size:15px; margin-bottom:4px;">Weekly Breakdown</div>
      ${weeklyBreakdownHtml(y,m,trades)}
    </div>
  `;

  document.getElementById('calPrev').onclick = ()=>{ state.calMonth--; if(state.calMonth<0){state.calMonth=11; state.calYear--;} render(); };
  document.getElementById('calNext').onclick = ()=>{ state.calMonth++; if(state.calMonth>11){state.calMonth=0; state.calYear++;} render(); };
  document.querySelectorAll('.cal-cell.has-trades').forEach(c=>{
    c.onclick = ()=>{ state.dayModal = c.dataset.date; render(); };
  });
}

function calendarCells(y,m,trades){
  const lead = firstWeekdayMon(y,m);
  const total = daysInMonth(y,m);
  let html = '';
  for(let i=0;i<lead;i++) html += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=total; day++){
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const dayTrades = trades.filter(t=>t.date===dateStr);
    const pnl = dayTrades.reduce((s,t)=> s + (Number(t.realizedPnL)||0), 0);
    let cls = 'cal-cell';
    if(dayTrades.length){ cls += ' has-trades'; cls += pnl>=0 ? ' win' : ' loss'; }
    html += `<div class="${cls}" data-date="${dateStr}">
      <div class="cal-daynum">${day}</div>
      ${dayTrades.length? `<div><div class="cal-pnl">${fmtMoney(pnl,true)}</div><div class="cal-count">${dayTrades.length} trade${dayTrades.length>1?'s':''}</div></div>` : ''}
    </div>`;
  }
  return html;
}

function monthlySummaryHtml(y,m,allTrades){
  const trades = allTrades.filter(t=>{ const d=new Date(t.date); return d.getFullYear()===y && d.getMonth()===m; });
  const wins = trades.filter(t=>Number(t.realizedPnL)>0);
  const losses = trades.filter(t=>Number(t.realizedPnL)<0);
  const net = trades.reduce((s,t)=>s+(Number(t.realizedPnL)||0),0);
  const winRate = trades.length? (wins.length/trades.length*100) : 0;
  const avgWin = wins.length? wins.reduce((s,t)=>s+Number(t.realizedPnL),0)/wins.length : 0;
  const avgLoss = losses.length? losses.reduce((s,t)=>s+Number(t.realizedPnL),0)/losses.length : 0;
  const expectancy = trades.length ? ((winRate/100)*avgWin + (1-winRate/100)*avgLoss) : 0;

  // weekly bars for the bar chart
  const weeks = weeksOfMonth(y,m);
  const weekTotals = weeks.map(w => trades.filter(t=>{ const d=+new Date(t.date); return d>=+w.start && d<=+w.end; }).reduce((s,t)=>s+(Number(t.realizedPnL)||0),0));
  const maxAbs = Math.max(1, ...weekTotals.map(v=>Math.abs(v)));

  if(!trades.length){
    return `<div class="empty-state">${ICONS.empty}<div>No trades logged in ${MONTHS[m]} yet.</div></div>`;
  }

  return `
    <div class="bars">
      ${weekTotals.map((v,i)=>`
        <div class="bar-col">
          <div class="bar ${v<0?'neg':''}" style="height:${Math.max(4,Math.abs(v)/maxAbs*90)}px;"></div>
          <div class="bar-label">W${i+1}</div>
        </div>`).join('')}
    </div>
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-label">Net PnL</div><div class="stat-value ${pnlClass(net)}">${fmtMoney(net,true)}</div></div>
      <div class="stat-box"><div class="stat-label">Win rate</div><div class="stat-value">${winRate.toFixed(1)}%</div></div>
      <div class="stat-box"><div class="stat-label">Expectancy</div><div class="stat-value">${expectancy.toFixed(3)}</div></div>
      <div class="stat-box"><div class="stat-label">Total trades</div><div class="stat-value">${trades.length}</div></div>
      <div class="stat-box"><div class="stat-label">Avg win</div><div class="stat-value pnl-pos">${fmtMoney(avgWin,true)}</div></div>
      <div class="stat-box"><div class="stat-label">Avg loss</div><div class="stat-value pnl-neg">${fmtMoney(avgLoss,true)}</div></div>
      <div class="stat-box"><div class="stat-label">Wins</div><div class="stat-value">${wins.length}</div></div>
      <div class="stat-box"><div class="stat-label">Losses</div><div class="stat-value">${losses.length}</div></div>
    </div>
  `;
}

function weeksOfMonth(y,m){
  const total = daysInMonth(y,m);
  const weeks = [];
  let cur = new Date(y,m,1);
  while(cur.getMonth()===m){
    const start = new Date(cur);
    const end = new Date(cur);
    end.setDate(end.getDate() + (6 - ((end.getDay()+6)%7)));
    if(end.getMonth()!==m) end.setDate(total);
    weeks.push({start, end: new Date(end.getFullYear(),end.getMonth(),end.getDate(),23,59,59)});
    cur = new Date(end); cur.setDate(cur.getDate()+1);
  }
  return weeks;
}

function weeklyBreakdownHtml(y,m,allTrades){
  const trades = allTrades.filter(t=>{ const d=new Date(t.date); return d.getFullYear()===y && d.getMonth()===m; });
  const weeks = weeksOfMonth(y,m);
  if(!trades.length) return `<div class="empty-state">${ICONS.empty}<div>Nothing to break down yet.</div></div>`;
  return weeks.map((w,i)=>{
    const wt = trades.filter(t=>{ const d=+new Date(t.date); return d>=+w.start && d<=+w.end; });
    const pnl = wt.reduce((s,t)=>s+(Number(t.realizedPnL)||0),0);
    return `<div class="week-row">
      <div>
        <div class="week-name">Week ${i+1}</div>
        <div class="week-trades">${wt.length} trade${wt.length!==1?'s':''}</div>
      </div>
      <div class="mono ${pnlClass(pnl)}" style="font-weight:600;">${wt.length? fmtMoney(pnl,true) : '—'}</div>
    </div>`;
  }).join('');
}

/* ---------------- Day modal ---------------- */
function renderDayModal(){
  const existing = document.getElementById('dayModalBackdrop');
  if(existing) existing.remove();
  if(!state.dayModal) return;
  const dateStr = state.dayModal;
  const trades = tradesForDate(dateStr);
  const backdrop = document.createElement('div');
  backdrop.id='dayModalBackdrop'; backdrop.className='modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal" style="max-width:560px;">
      <div class="modal-head">
        <div>
          <div style="font-weight:700; font-family:'Space Grotesk',sans-serif; font-size:16px;">${dateStr}</div>
          <div class="page-sub" style="margin-top:2px;">${trades.length} trade${trades.length!==1?'s':''} · ${state.market.toUpperCase()}</div>
        </div>
        <button class="modal-close" id="dayModalClose">×</button>
      </div>
      ${trades.length? trades.map(t=>{
        const isFx = t.market === 'fx';
        const sizeLabel = isFx ? 'Lot size' : 'Leverage';
        const sizeVal = isFx ? t.lotSize : t.leverage;
        const metaBits = [
          t.orderAmount? `Order ${t.orderAmount}` : '',
          (t.entryPrice||t.exitPrice)? `${t.entryPrice||'—'} → ${t.exitPrice||'—'}` : '',
          t.fee? `Fee ${t.fee}` : '',
          sizeVal? `${sizeLabel} ${sizeVal}` : '',
          t.duration? t.duration : '',
        ].filter(Boolean).join(' · ');
        return `
        <div class="trade-row" data-id="${t.id}">
          <div class="tc-top">
            <div class="tc-left">
              <span class="side-tag ${/short|sell/i.test(t.side||'')?'side-short':'side-long'}">${esc((t.side||'—')).toUpperCase()}</span>
              <span class="tc-symbol">${esc(t.symbol)}</span>
            </div>
            <div class="tc-right">
              <span class="mono ${pnlClass(t.realizedPnL)}" style="font-weight:700;">${fmtMoney(t.realizedPnL,true)}</span>
              <button type="button" class="del-btn" data-del="${t.id}" title="Delete trade">${ICONS.trash}</button>
            </div>
          </div>
          ${metaBits? `<div class="tc-meta"><span class="tc-meta-item">${esc(metaBits)}</span></div>` : ''}
        </div>`;
      }).join('') : `<div class="empty-state">No trades on this day.</div>`}
    </div>
  `;
  document.body.appendChild(backdrop);
  backdrop.onclick = (e)=>{ if(e.target===backdrop){ state.dayModal=null; render(); } };
  document.getElementById('dayModalClose').onclick = ()=>{ state.dayModal=null; render(); };
  backdrop.querySelectorAll('.trade-row').forEach(r=> r.onclick = (e)=>{
    if(e.target.closest('[data-del]')) return;
    state.dayModal=null; state.reviewingId=r.dataset.id; render();
  });
  backdrop.querySelectorAll('[data-del]').forEach(b=> b.onclick = (e)=>{ e.stopPropagation(); deleteTrade(b.dataset.del); });
}

/* ---------------- Review & Reflection modal ---------------- */
function renderReviewModal(){
  const existing = document.getElementById('reviewBackdrop');
  if(existing) existing.remove();
  if(!state.reviewingId) return;
  const trade = currentTrades().find(t=>t.id===state.reviewingId);
  if(!trade){ state.reviewingId=null; return; }
  const r = trade.review || { followed:null, whichPlan:[], confluence:[], mistake:[], tradeManagement:'', riskReward:'', entryEmotion:[], exitEmotion:[], note:'' };

  const backdrop = document.createElement('div');
  backdrop.id='reviewBackdrop'; backdrop.className='modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <div>
          <div style="font-weight:700; font-family:'Space Grotesk',sans-serif; font-size:16px;">Review &amp; Reflection</div>
          <div class="page-sub" style="margin-top:2px;">${esc(trade.symbol)} · ${trade.date||''}</div>
        </div>
        <button class="modal-close" id="reviewClose">×</button>
      </div>

      <div class="trade-summary-strip">
        <div><span>Side</span>${esc((trade.side||'—')).toUpperCase()}</div>
        ${trade.market!=='fx'? `<div><span>Order amt</span>${trade.orderAmount||'—'}</div>` : ''}
        ${trade.market!=='fx'? `<div><span>Filled amt</span>${trade.filledAmount||'—'}</div>` : ''}
        <div><span>Entry</span>${trade.entryPrice||'—'}</div>
        <div><span>Exit</span>${trade.exitPrice||'—'}</div>
        ${trade.market!=='fx'? `<div><span>Fee</span>${trade.fee!==undefined&&trade.fee!==''?trade.fee:'—'}</div>` : ''}
        ${trade.market==='fx'? `<div><span>Pips</span>${trade.pips!==undefined&&trade.pips!==''?trade.pips:'—'}</div>` : ''}
        ${trade.market==='fx'? `<div><span>Swap/Comm.</span>${trade.swap!==undefined&&trade.swap!==''?trade.swap:'—'}</div>` : ''}
        <div><span>${trade.market==='fx'?'Lot size':'Leverage'}</span>${(trade.market==='fx'? trade.lotSize : trade.leverage)||'—'}</div>
        ${trade.market!=='fx'? `<div><span>Margin</span>${trade.marginMode?trade.marginMode[0].toUpperCase()+trade.marginMode.slice(1):'—'}</div>` : ''}
        <div><span>Duration</span>${trade.duration||'—'}</div>
        <div><span>PnL</span><span class="${pnlClass(trade.realizedPnL)}">${fmtMoney(trade.realizedPnL,true)}</span></div>
      </div>

      <div class="section-label">Plan</div>
      <div class="check-row" id="chk_followed">
        <div class="check-box ${r.followed===true?'checked':''}"></div> I followed my trade plan
      </div>
      <div class="check-row" id="chk_notfollowed">
        <div class="check-box ${r.followed===false?'checked':''}"></div> I didn't follow my trade plan
      </div>

      <div class="form-grid" style="margin-top:8px;">
        ${renderMultiField('whichPlan','Which plan did you actually follow', OPTS.whichPlan, 'Type or pick — e.g. A+ Setup')}
        <div class="field">
          <label>Trade management</label>
          <input id="f_tm" value="${esc(r.tradeManagement)}" placeholder="e.g. did you hold it to your full TP">
        </div>
        <div class="field">
          <label>Risk to Reward</label>
          <input id="f_rr" value="${esc(r.riskReward)}" placeholder="e.g 1:3">
        </div>
      </div>

      <div class="section-label">Entry confluences</div>
      ${renderMultiField('confluence', null, OPTS.confluences, 'Type or pick — e.g. HTF POI Mitigation')}

      <div class="section-label">Mistakes <span class="opt-tag">(optional)</span></div>
      ${renderMultiField('mistake', null, OPTS.mistakes, 'Type or pick — e.g. Impatience')}

      <div class="form-grid" style="margin-top:14px;">
        ${renderMultiField('entryEmotion','Entry emotions', OPTS.entryEmotion, 'Type or pick — e.g. Calm')}
        ${renderMultiField('exitEmotion','Exit emotions', OPTS.exitEmotion, 'Type or pick — e.g. Relaxed')}
      </div>

      <div class="section-label">Reflection</div>
      <div class="field">
        <textarea id="f_note" rows="3" placeholder="Add some notes about your reflection">${esc(r.note)}</textarea>
      </div>

      <div style="margin-top:20px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <button class="btn btn-primary" id="reviewSave" disabled>Save reflection</button>
        <button class="btn btn-ghost" id="reviewDelete" style="color:var(--red);">Delete trade</button>
        <span style="font-size:12px;color:var(--text-faint);" id="reviewHint">Fill the required fields to enable saving.</span>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);

  document.getElementById('reviewDelete').onclick = ()=> deleteTrade(trade.id);

  let localFollowed = r.followed;

  function refreshChecks(){
    document.querySelector('#chk_followed .check-box').classList.toggle('checked', localFollowed===true);
    document.querySelector('#chk_notfollowed .check-box').classList.toggle('checked', localFollowed===false);
  }
  document.getElementById('chk_followed').onclick = ()=>{ localFollowed = (localFollowed===true)? null : true; refreshChecks(); checkReady(); };
  document.getElementById('chk_notfollowed').onclick = ()=>{ localFollowed = (localFollowed===false)? null : false; refreshChecks(); checkReady(); };

  const msWhichPlan = wireMultiSelect('whichPlan', r.whichPlan||[], OPTS.whichPlan, checkReady);
  const msConfluence = wireMultiSelect('confluence', r.confluence||[], OPTS.confluences, checkReady);
  const msMistake = wireMultiSelect('mistake', r.mistake||[], OPTS.mistakes, checkReady);
  const msEntryEmotion = wireMultiSelect('entryEmotion', r.entryEmotion||[], OPTS.entryEmotion, checkReady);
  const msExitEmotion = wireMultiSelect('exitEmotion', r.exitEmotion||[], OPTS.exitEmotion, checkReady);

  function checkReady(){
    const ready = localFollowed!==null && localFollowed!==undefined
      && msWhichPlan.getValues().length
      && msConfluence.getValues().length
      // mistake is optional — not checked here
      && document.getElementById('f_tm').value.trim()
      && msEntryEmotion.getValues().length
      && msExitEmotion.getValues().length
      && document.getElementById('f_note').value.trim();
    document.getElementById('reviewSave').disabled = !ready;
    document.getElementById('reviewHint').style.display = ready ? 'none' : 'inline';
  }
  ['f_tm','f_note'].forEach(id=>{
    document.getElementById(id).addEventListener('input', checkReady);
  });
  checkReady();

  backdrop.onclick = (e)=>{ if(e.target===backdrop){ state.reviewingId=null; render(); } };
  document.getElementById('reviewClose').onclick = ()=>{ state.reviewingId=null; render(); };

  document.getElementById('reviewSave').onclick = async ()=>{
    trade.review = {
      followed: localFollowed,
      whichPlan: msWhichPlan.getValues(),
      confluence: msConfluence.getValues(),
      mistake: msMistake.getValues(),
      tradeManagement: document.getElementById('f_tm').value.trim(),
      riskReward: document.getElementById('f_rr').value.trim(),
      entryEmotion: msEntryEmotion.getValues(),
      exitEmotion: msExitEmotion.getValues(),
      note: document.getElementById('f_note').value.trim(),
    };
    await persistTrades();
    state.reviewingId = null;
    showToast('Reflection saved.');
    render();
  };
}

function renderMultiField(id, label, options, placeholder){
  return `
    <div class="field field-full">
      ${label? `<label>${label}</label>` : ''}
      <div class="multiselect" id="ms_${id}">
        <div class="ms-box" id="ms_${id}_box">
          <span class="chips-slot" id="ms_${id}_chips"></span>
          <input type="text" id="ms_${id}_input" class="ms-inline-input" placeholder="${placeholder}" autocomplete="off">
          <button type="button" class="ms-caret" id="ms_${id}_caret" tabindex="-1" title="Show/hide options">${ICONS.chevDown}</button>
        </div>
        <div class="ms-panel" id="ms_${id}_panel"></div>
      </div>
    </div>`;
}

function wireMultiSelect(id, initialArr, options, onChange){
  let values = (initialArr||[]).slice();
  const boxEl = document.getElementById(`ms_${id}_box`);
  const chipsEl = document.getElementById(`ms_${id}_chips`);
  const inputEl = document.getElementById(`ms_${id}_input`);
  const panelEl = document.getElementById(`ms_${id}_panel`);
  const caretEl = document.getElementById(`ms_${id}_caret`);
  const basePlaceholder = inputEl.getAttribute('placeholder') || '';

  function renderChips(){
    chipsEl.innerHTML = values.map(v=>`<span class="chip">${esc(v)}<button type="button" class="chip-x" data-v="${esc(v)}">&times;</button></span>`).join('');
    chipsEl.querySelectorAll('.chip-x').forEach(b=>{
      b.onclick = (e)=>{ e.stopPropagation(); values = values.filter(x=>x!==b.dataset.v); renderChips(); onChange(); };
    });
    // once at least one option is picked, the hint placeholder is no longer needed
    inputEl.placeholder = values.length ? '' : basePlaceholder;
  }
  function renderPanel(){
    const q = inputEl.value.trim().toLowerCase();
    const filtered = options.filter(o=> o.toLowerCase().includes(q));
    let html = filtered.map(o=>{
      const sel = values.includes(o);
      return `<button type="button" class="ms-opt ${sel?'sel':''}" data-v="${esc(o)}"><span class="ms-opt-check">${sel?'✓':''}</span>${esc(o)}</button>`;
    }).join('');
    const typed = inputEl.value.trim();
    if(typed && !options.some(o=>o.toLowerCase()===typed.toLowerCase()) && !values.includes(typed)){
      html += `<button type="button" class="ms-opt ms-opt-custom" data-custom="1"><span class="ms-opt-check">+</span>Add "${esc(typed)}"</button>`;
    }
    if(!html) html = `<div class="ms-empty">Type to add a custom option</div>`;
    panelEl.innerHTML = html;
    panelEl.querySelectorAll('.ms-opt[data-v]').forEach(el=>{
      el.onclick = (e)=>{ e.stopPropagation(); toggle(el.dataset.v); };
    });
    const customEl = panelEl.querySelector('.ms-opt[data-custom]');
    if(customEl) customEl.onclick = (e)=>{ e.stopPropagation(); addCustom(); };
  }
  function toggle(v){
    if(values.includes(v)) values = values.filter(x=>x!==v);
    else values.push(v);
    renderChips(); renderPanel(); onChange();
    inputEl.focus();
  }
  function addCustom(){
    const v = inputEl.value.trim();
    if(v && !values.includes(v)) values.push(v);
    inputEl.value = '';
    renderChips(); renderPanel(); onChange();
    inputEl.focus();
  }
  function openPanel(){ panelEl.classList.add('open'); caretEl.classList.add('open'); renderPanel(); }
  function closePanel(){ panelEl.classList.remove('open'); caretEl.classList.remove('open'); }
  function togglePanel(){ panelEl.classList.contains('open') ? closePanel() : openPanel(); }

  boxEl.addEventListener('click', (e)=>{ if(e.target===caretEl) return; inputEl.focus(); openPanel(); });
  inputEl.addEventListener('focus', openPanel);
  inputEl.addEventListener('input', ()=> renderPanel());
  inputEl.addEventListener('keydown', e=>{
    if(e.key==='Enter' || e.key===','){ e.preventDefault(); addCustom(); }
    else if(e.key==='Escape'){ closePanel(); }
    else if(e.key==='Backspace' && !inputEl.value && values.length){ values.pop(); renderChips(); renderPanel(); onChange(); }
  });
  caretEl.addEventListener('click', (e)=>{ e.stopPropagation(); togglePanel(); if(panelEl.classList.contains('open')) inputEl.focus(); });

  renderChips();
  return { getValues: ()=>values };
}

/* Close any open dropdown panel when clicking outside it — registered once globally */
document.addEventListener('mousedown', (e)=>{
  document.querySelectorAll('.ms-panel.open').forEach(p=>{
    const container = p.closest('.multiselect');
    if(container && !container.contains(e.target)){
      p.classList.remove('open');
      const caret = container.querySelector('.ms-caret');
      if(caret) caret.classList.remove('open');
    }
  });
});

/* ---------------- mobile menu ---------------- */
document.getElementById('menuToggle')?.addEventListener('click', ()=>{
  const sidebar = document.getElementById('sidebar');
  if(sidebar.classList.contains('open')) closeSidebarMenu();
  else openSidebarMenu();
});
document.getElementById('sidebarOverlay')?.addEventListener('click', closeSidebarMenu);

document.getElementById('mobileThemeToggle')?.addEventListener('click', async ()=>{
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', state.theme);
  await persistTheme();
  render();
});

/* ---------------- boot ---------------- */
(async function boot(){
  await loadState();
  render();
})();
</script>
